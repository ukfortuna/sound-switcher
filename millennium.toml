[plugin]
id = "local.sound-switcher"
name = "Sound Switcher"
version = "0.1.5"
author = "Sound Switcher contributors"
description = "Experimental custom private-message sounds with a file picker and preview."
[backend]
entry = "backend/main.lua"
sources = ["backend/**/*.lua"]
[frontend]
entry = "frontend/index.tsx"
[webkit]
entry = "webview/preload.ts"
[compiler]
output_path = "auto"
[dev]
auto_restart = true
reload_steamui_when = "both"


